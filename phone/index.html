<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0e">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WAV PHONE">
<title>WAV PHONE</title>
<link rel="manifest" id="mf" href="data:application/manifest+json,%7B%7D">
<link rel="apple-touch-icon" id="ati" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --acc:#2f8dff; --acc2:#9fd2ff; --accD:#0b3f99;
  --body1:#23242a; --body2:#060608;
  --zh:"ZCOOL QingKe HuangYou","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --px:"Silkscreen","ZCOOL QingKe HuangYou","PingFang SC",monospace;
  --u:1.5px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-skin="red"]{--acc:#ff3346;--acc2:#ffb0b7;--accD:#8a0a18}
:root[data-skin="lime"]{--acc:#8fe02a;--acc2:#dcffb0;--accD:#2f6a05}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--body1:#23242a;--body2:#060608}}
:root[data-theme="dark"]{--body1:#23242a;--body2:#060608}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none;
  background:linear-gradient(180deg,var(--body1),var(--body2) 55%,#121318)}
body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:transparent;color:#fff;font-family:var(--zh);
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;-webkit-text-size-adjust:100%;touch-action:none}

/* ===== 机身（整屏） ===== */
.phone{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:4px max(14px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px))}
.phone::before{content:"";position:absolute;left:0;right:0;top:calc(-1*env(safe-area-inset-top,0px));height:38%;pointer-events:none;
  background:linear-gradient(172deg,rgba(255,255,255,.09),rgba(255,255,255,0) 60%)}
.stripe{position:absolute;top:calc(-1*env(safe-area-inset-top,0px));bottom:calc(-1*env(safe-area-inset-bottom,0px));width:4px;pointer-events:none;
  background:linear-gradient(180deg,var(--acc2),var(--acc) 18%,var(--accD) 50%,var(--acc) 82%,var(--acc2));box-shadow:0 0 12px var(--acc)}
.stripe.l{left:0}.stripe.r{right:0}
.head{flex:none;height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.ear{width:64px;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,#3a3b44 0 2px,#0a0a0c 2px 4px);
  box-shadow:0 0 0 1px #000,0 1px 0 rgba(255,255,255,.12)}
.brand{font-family:"Silkscreen",monospace;font-size:10px;letter-spacing:.32em;color:#c9ccd6;
  background:linear-gradient(180deg,#fff,#9da2b0 55%,#e8eaf0);-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 0}
.lcd{position:relative;overflow:hidden;background:#000;border-radius:2px;width:240px;height:320px;
  box-shadow:0 0 0 2px #000,0 0 0 3px #3a3c46,0 0 0 5px #0a0a0c,0 6px 18px rgba(0,0,0,.6);touch-action:none}
.lcd.green{filter:grayscale(1) contrast(1.3) sepia(1) hue-rotate(38deg) saturate(1.8) brightness(.95)}
.lcd canvas{position:absolute;inset:0;width:100%;height:100%;display:none;image-rendering:crisp-edges;image-rendering:pixelated}
.scan{position:absolute;inset:0;pointer-events:none;z-index:9;
  background:linear-gradient(125deg,rgba(255,255,255,.12),rgba(255,255,255,0) 32%)}

/* ===== 屏幕 UI（逻辑 240×320，单位 --u） ===== */
.status{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*16);z-index:6;display:flex;justify-content:space-between;align-items:center;
  padding:0 calc(var(--u)*5);font-family:"Silkscreen",monospace;font-size:calc(var(--u)*8);color:#fff;text-shadow:1px 1px 0 #000;pointer-events:none;
  background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0))}
.bars{display:flex;align-items:flex-end;gap:calc(var(--u)*1);height:calc(var(--u)*8)}
.bars i{display:block;width:calc(var(--u)*2);background:#fff}
.bars i:nth-child(1){height:30%}.bars i:nth-child(2){height:55%}.bars i:nth-child(3){height:80%}.bars i:nth-child(4){height:100%}
.bat{width:calc(var(--u)*13);height:calc(var(--u)*7);border:1px solid #fff;position:relative}
.bat::after{content:"";position:absolute;inset:1px;right:25%;background:var(--acc2)}
.soft{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*22);z-index:6;display:flex;justify-content:space-between;align-items:center;
  padding:0 calc(var(--u)*7);font-size:calc(var(--u)*12);color:#fff;text-shadow:1px 1px 0 #000;
  background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.72) 45%)}
.soft span{min-width:calc(var(--u)*44);pointer-events:auto}
.soft span:nth-child(2){text-align:center}.soft span:nth-child(3){text-align:right}
#ui{position:absolute;inset:0;z-index:5}
.scr{position:absolute;inset:0;background:radial-gradient(120% 55% at 50% 112%,var(--acc) 0,rgba(0,0,0,0) 62%),
  radial-gradient(90% 45% at 12% 8%,rgba(120,70,255,.35),rgba(0,0,0,0) 70%),linear-gradient(#070a18,#02030a)}
.scr::after{content:"";position:absolute;left:-20%;right:-20%;top:58%;height:calc(var(--u)*40);border-radius:50%;
  border-top:calc(var(--u)*2) solid rgba(255,255,255,.12);transform:rotate(-8deg);pointer-events:none}
.hdr{position:absolute;left:0;right:0;top:calc(var(--u)*16);height:calc(var(--u)*24);display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*5);
  font-size:calc(var(--u)*14);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.6);
  background:linear-gradient(180deg,var(--acc2) 0,var(--acc) 48%,var(--accD) 52%,var(--acc) 100%);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.lst{position:absolute;left:0;right:0;top:calc(var(--u)*44);bottom:calc(var(--u)*23);overflow:auto;padding:0 calc(var(--u)*4);scrollbar-width:none;touch-action:pan-y}
.lst::-webkit-scrollbar{display:none}
.row{height:calc(var(--u)*28);display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--u)*9);margin-bottom:calc(var(--u)*2);
  font-size:calc(var(--u)*13);color:#dfe6ff;border-radius:calc(var(--u)*4);border-bottom:1px solid rgba(255,255,255,.06)}
.row .v{color:var(--acc2);font-size:.92em}
.row.on{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.6) 0,var(--acc2) 8%,var(--acc) 55%,var(--accD));box-shadow:0 0 calc(var(--u)*6) var(--acc)}
.row.on .v{color:#fff}
.row .v::before{content:"◂ ";opacity:.6}.row .v::after{content:" ▸";opacity:.6}
.row .v.nv::before,.row .v.nv::after{content:""}
.txt{position:absolute;left:0;right:0;top:calc(var(--u)*44);bottom:calc(var(--u)*23);overflow:auto;padding:calc(var(--u)*4) calc(var(--u)*12);
  font-size:calc(var(--u)*11.5);line-height:1.55;color:#e6ebff;touch-action:pan-y;scrollbar-width:none}
.txt::-webkit-scrollbar{display:none}
.txt p{margin:0 0 .6em}.txt b{color:var(--acc2);font-weight:400}
.grid{position:absolute;left:calc(var(--u)*10);right:calc(var(--u)*10);top:calc(var(--u)*50);bottom:calc(var(--u)*30);display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*8)}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*5);border-radius:calc(var(--u)*12);
  font-size:calc(var(--u)*13);color:#e6ebff;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.tile svg{width:calc(var(--u)*54);height:calc(var(--u)*54)}
.tile.on{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.35),var(--acc) 40%,var(--accD));box-shadow:0 0 calc(var(--u)*10) var(--acc),inset 0 1px 0 rgba(255,255,255,.6)}
.dim{position:absolute;inset:0;background:rgba(0,0,10,.55)}
.dlg{position:absolute;left:calc(var(--u)*14);right:calc(var(--u)*14);top:50%;transform:translateY(-52%);
  background:linear-gradient(#1a2344,#070b1c);border:1px solid var(--acc2);border-radius:calc(var(--u)*6);overflow:hidden;
  box-shadow:0 0 0 1px #000,0 calc(var(--u)*8) calc(var(--u)*20) rgba(0,0,0,.7)}
.dlg h3{margin:0;height:calc(var(--u)*22);display:flex;align-items:center;justify-content:center;font-weight:400;font-size:calc(var(--u)*13);
  background:linear-gradient(180deg,var(--acc2) 0,var(--acc) 48%,var(--accD) 52%,var(--acc))}
.dlg .rows{padding:calc(var(--u)*5)}
.dlg .row{margin-bottom:calc(var(--u)*3)}
.res{text-align:center;padding:calc(var(--u)*6) calc(var(--u)*8) 0}
.grade{font-family:"Silkscreen",monospace;font-weight:700;font-size:calc(var(--u)*46);line-height:1;
  background:linear-gradient(180deg,#fff 0,#ffe98a 40%,#c07a10 52%,#fff2b0 70%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 calc(var(--u)*2) 0 rgba(0,0,0,.6))}
.ttl{font-size:calc(var(--u)*15);color:var(--acc2);margin:calc(var(--u)*2) 0 calc(var(--u)*5)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*3) calc(var(--u)*8);font-size:calc(var(--u)*11);color:#cfd6f5;text-align:left;
  border-top:1px solid rgba(255,255,255,.1);padding-top:calc(var(--u)*6)}
.stats b{float:right;font-family:"Silkscreen",monospace;font-weight:400;color:#fff}
.cmt{font-size:calc(var(--u)*10.5);color:#aeb8e0;margin-top:calc(var(--u)*6);line-height:1.45}

/* 搭房子 HUD */
.hud{position:absolute;left:0;right:0;top:calc(var(--u)*17);z-index:3;display:none;justify-content:space-between;align-items:center;
  padding:0 calc(var(--u)*6);font-size:calc(var(--u)*12);color:#fff;text-shadow:1px 1px 0 #000,-1px 0 0 #000,0 -1px 0 #000;pointer-events:none}
.hud.on{display:flex}
.hud b{font-family:"Silkscreen",monospace;font-weight:400;color:#ffe98a;margin-left:calc(var(--u)*2)}
.lives{display:flex;gap:calc(var(--u)*2)}
.lives i{display:block;width:calc(var(--u)*9);height:calc(var(--u)*7);background:#ffd84a;box-shadow:inset 0 -2px 0 #b07a0a,0 0 0 1px #000}
.lives i.x{background:#444;box-shadow:inset 0 -2px 0 #222,0 0 0 1px #000}
.bal{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*6);top:calc(var(--u)*33);height:calc(var(--u)*3);z-index:3;display:none;background:rgba(0,0,0,.5);pointer-events:none}
.bal.on{display:block}
.bal::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:rgba(255,255,255,.7)}
.bal i{position:absolute;top:0;bottom:0;left:50%;width:calc(var(--u)*5);margin-left:calc(var(--u)*-2.5);background:#7dff9a}
.flash{position:absolute;left:0;right:0;top:36%;z-index:4;text-align:center;font-size:calc(var(--u)*22);
  color:#fff36b;-webkit-text-stroke:1px #2a0d55;text-shadow:2px 3px 0 #2a0d55;opacity:0;pointer-events:none}
.flash.bad{color:#ff7a9c}.flash.good{color:#7dffea}
.flash.go{animation:pop .9s steps(9) forwards}
@keyframes pop{0%{opacity:1;transform:scale(.6)}20%{transform:scale(1.15)}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}

/* ===== 按键区 ===== */
button{font:inherit;color:inherit;border:0;padding:0;background:none;cursor:pointer;touch-action:none;-webkit-touch-callout:none}
button:focus-visible{outline:2px dashed var(--acc2);outline-offset:2px}
.keys{flex:none;display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto;gap:10px 12px;align-items:center;padding:12px 2px 2px}
.kb{height:46px;display:grid;place-items:center;
  background:linear-gradient(180deg,#2c2d34,#131418 60%,#0c0d10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 1px #000,0 3px 0 #000}
.kb.sl{border-radius:8px 8px 8px 22px}.kb.sr{border-radius:8px 8px 22px 8px}
.kb.sl::after,.kb.sr::after{content:"";width:22px;height:3px;border-radius:2px;background:var(--acc2);box-shadow:0 0 6px var(--acc)}
.kb.call{grid-row:2;grid-column:1;border-radius:22px 8px 8px 22px;height:48px}
.kb.end{grid-row:2;grid-column:3;border-radius:8px 22px 22px 8px;height:48px}
.kb svg{width:26px;height:26px}
.nav{grid-row:1/3;grid-column:2;position:relative;width:clamp(118px,34vw,150px);aspect-ratio:1.12/1;border-radius:30%;
  background:radial-gradient(ellipse at 50% 30%,#3a3c46,#101116 70%);
  box-shadow:0 0 0 2px #000,0 0 0 4px #4a4d58,0 0 0 5px #000,0 0 14px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.18)}
.nav::before{content:"";position:absolute;inset:7%;border-radius:30%;border:1px solid var(--acc);opacity:.55;pointer-events:none;box-shadow:0 0 6px var(--acc)}
.nav button{position:absolute;display:grid;place-items:center;color:var(--acc2);font-size:11px}
.nav .u{top:0;left:26%;width:48%;height:26%}.nav .d{bottom:0;left:26%;width:48%;height:26%}
.nav .l{left:0;top:26%;width:26%;height:48%}.nav .r{right:0;top:26%;width:26%;height:48%}
.nav .ok{left:28%;top:28%;width:44%;height:44%;border-radius:26%;
  background:linear-gradient(180deg,#f4f6fb,#a6abb9 48%,#7d8394 52%,#d7dbe5);box-shadow:0 0 0 1px #000,0 2px 0 #000,inset 0 1px 0 #fff;
  font-family:"Silkscreen",monospace;font-weight:700;font-size:13px;color:#1a1b22}
.music{flex:none;display:flex;justify-content:center;gap:14px;padding:12px 0 2px}
.music button{width:62px;height:30px;border-radius:15px;display:grid;place-items:center;
  background:linear-gradient(180deg,#26272d,#0e0f12);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px #000}
.music svg{width:18px;height:12px;fill:var(--acc2)}
.down{filter:brightness(1.5)}
.nav .down{filter:none;background:rgba(255,255,255,.08);border-radius:30%}
.nav .ok.down{filter:brightness(.85)}
@media (max-height:640px){.music{display:none}.keys{padding-top:8px}.head{height:26px}}
.rot{position:fixed;inset:0;z-index:20;display:none;place-items:center;text-align:center;padding:24px;background:#07070a;color:#fff;font-size:20px}
@media (orientation:landscape) and (max-height:500px){.rot{display:grid}}

/* 细腻像素栅格：按逻辑 240×320 画出 LCD 像素缝 */
.pix{position:absolute;inset:0;pointer-events:none;z-index:8;opacity:.55;
  background:linear-gradient(90deg,rgba(0,0,0,.22) 0,rgba(0,0,0,0) 34%) 0 0/var(--u) var(--u),
             linear-gradient(0deg,rgba(0,0,0,.18) 0,rgba(0,0,0,0) 34%) 0 0/var(--u) var(--u)}
.lcd video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none;z-index:2;image-rendering:pixelated}
#ov{position:absolute;inset:0;z-index:4;pointer-events:none}
.combo{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*6);top:calc(var(--u)*39);height:calc(var(--u)*4);z-index:3;display:none;
  background:rgba(0,0,0,.5);box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.combo.on{display:block}
.combo i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ff5ad8,#ffe85a);box-shadow:0 0 6px #ff9af0}
.combo span{position:absolute;right:0;top:calc(var(--u)*5);font-family:"Silkscreen",monospace;font-size:calc(var(--u)*8);color:#ffe85a;text-shadow:1px 1px 0 #000}
/* 待机 */
.stby{position:absolute;inset:0;
  background:radial-gradient(140% 70% at 110% 100%,var(--acc) 0,rgba(0,0,0,0) 55%),
    radial-gradient(120% 60% at -10% 110%,var(--accD) 0,rgba(0,0,0,0) 60%),
    linear-gradient(170deg,#0a1230 0,#050814 55%,#01020a)}
.stby::before,.stby::after{content:"";position:absolute;left:-30%;right:-30%;border-radius:50%;pointer-events:none}
.stby::before{top:52%;height:calc(var(--u)*90);border-top:calc(var(--u)*3) solid rgba(255,255,255,.18);transform:rotate(-12deg)}
.stby::after{top:60%;height:calc(var(--u)*110);border-top:calc(var(--u)*1.5) solid var(--acc2);opacity:.45;transform:rotate(-6deg)}
.op{position:absolute;left:0;right:0;top:calc(var(--u)*22);text-align:center;font-size:calc(var(--u)*12);color:#dfe6ff;letter-spacing:.1em}
.bigclock{position:absolute;left:0;right:0;top:calc(var(--u)*52);text-align:center;font-family:"Silkscreen",monospace;font-size:calc(var(--u)*44);line-height:1;
  color:#fff;text-shadow:0 calc(var(--u)*2) 0 rgba(0,0,0,.6),0 0 calc(var(--u)*10) var(--acc)}
.date{position:absolute;left:0;right:0;top:calc(var(--u)*104);text-align:center;font-size:calc(var(--u)*12);color:#b8c6f0}
.nowfm{position:absolute;left:calc(var(--u)*10);right:calc(var(--u)*10);bottom:calc(var(--u)*30);text-align:center;font-size:calc(var(--u)*11);color:#fff;
  padding:calc(var(--u)*4);border-radius:calc(var(--u)*4);background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12)}
/* 功能表宫格 */
.mgrid{position:absolute;left:calc(var(--u)*4);right:calc(var(--u)*4);top:calc(var(--u)*43);bottom:calc(var(--u)*24);display:grid;
  grid-template-columns:repeat(3,1fr);grid-auto-rows:calc(var(--u)*62);gap:calc(var(--u)*2);overflow:auto;scrollbar-width:none;touch-action:pan-y}
.mgrid::-webkit-scrollbar{display:none}
.mi{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2);border-radius:calc(var(--u)*8);font-size:calc(var(--u)*9.5);color:#cfd8f8}
.mi svg{width:calc(var(--u)*40);height:calc(var(--u)*40);filter:drop-shadow(0 calc(var(--u)*2) 0 rgba(0,0,0,.5))}
.mi.on{background:linear-gradient(180deg,rgba(255,255,255,.35),var(--acc) 45%,var(--accD));box-shadow:0 0 calc(var(--u)*8) var(--acc),inset 0 1px 0 rgba(255,255,255,.6);color:#fff}
.mi.on svg{transform:scale(1.08)}
.ovbox{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*6);padding:calc(var(--u)*3) calc(var(--u)*6);font-size:calc(var(--u)*10.5);color:#fff;
  background:rgba(4,8,24,.72);border:1px solid rgba(255,255,255,.15);border-radius:calc(var(--u)*4);text-shadow:1px 1px 0 #000;line-height:1.4}
.ovbox b{color:#ffe98a;font-weight:400}

/* ===================== v4 refinements ===================== */
.mgrid{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.mi{min-width:0}
.mi span{white-space:nowrap;font-size:calc(var(--u)*13);line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row span:first-child{flex:1;min-width:0}
:root{--zh:"VT323","Silkscreen",monospace;--px:"Silkscreen",monospace}
body{font-family:var(--zh)}
.lcd{border-radius:1px;box-shadow:0 0 0 2px #000,0 0 0 3px #50535f,0 0 0 4px #15161b,0 0 0 6px #000,0 8px 22px rgba(0,0,0,.7)}
/* LCD pixel matrix: dark gaps between each of the 240×320 pixels + faint RGB stripes */
.pix{opacity:1;
  background:
   linear-gradient(90deg,rgba(0,0,0,.15) 0,rgba(0,0,0,.15) 16%,rgba(0,0,0,0) 16%) 0 0/var(--u) var(--u),
   linear-gradient(0deg,rgba(0,0,0,.12) 0,rgba(0,0,0,.12) 16%,rgba(0,0,0,0) 16%) 0 0/var(--u) var(--u),
   linear-gradient(90deg,rgba(255,60,60,.05) 0 33%,rgba(60,255,60,.05) 33% 66%,rgba(60,60,255,.05) 66%) 0 0/var(--u) var(--u)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
let time=0;

/* ---------- 设置（不含任何分数记录） ---------- */
const SKEY='pixelfone-settings';
const S={snd:true,vib:true,green:false,skin:'blue',look:'black',snakeLevel:5,snakeMaze:0,m3diff:'normal'};
try{const o=JSON.parse(localStorage.getItem(SKEY)||'{}');if(o&&typeof o==='object')Object.assign(S,o);}catch(e){}
const saveS=()=>{try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}};
function applySkin(){const r=document.documentElement;r.dataset.skin=S.skin==='blue'?'':S.skin;r.dataset.look=S.look||'black';$('#lcd').classList.toggle('green',!!S.green);
  const tc=S.look==='pearl'?'#eef1f7':'#0b0b0e';const m=document.querySelector('meta[name=theme-color]');if(m)m.content=tc;pixKey='';if(typeof layout==='function')try{layout()}catch(e){}}

/* ---------- 声音 / 振动 ---------- */
let ac=null;
function ensureAC(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(ac&&ac.state==='suspended')ac.resume();
}
function tone(f,d,o={}){
  if(!S.snd||!ac)return;
  const {type='square',vol=.05,delay=0,slide=0}=o;
  const t=ac.currentTime+delay,osc=ac.createOscillator(),g=ac.createGain();
  osc.type=type;osc.frequency.setValueAtTime(f,t);
  if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  osc.connect(g);g.connect(ac.destination);osc.start(t);osc.stop(t+d+.03);
}
const SFX={
  key:()=>tone(1500,.03,{vol:.022}),
  drop:()=>tone(700,.14,{slide:-380,vol:.04}),
  land:()=>{tone(150,.12,{type:'triangle',vol:.14});tone(95,.08,{vol:.04})},
  perfect:c=>[0,4,7,12].forEach((s,i)=>tone(620*Math.pow(2,(s+Math.min(c,7))/12),.07,{delay:i*.055,vol:.045})),
  miss:()=>{tone(220,.4,{type:'sawtooth',slide:-170,vol:.06});tone(110,.3,{delay:.1,vol:.04})},
  start:()=>[523,659,784,659,880,1047].forEach((f,i)=>tone(f,.09,{delay:i*.085,vol:.045})),
  bonus:()=>[784,988,1175,1568].forEach((f,i)=>tone(f,.1,{delay:i*.07,vol:.045})),
  over:()=>[440,370,311,262,196].forEach((f,i)=>tone(f,.18,{delay:i*.15,vol:.05})),
  eat:()=>tone(1320,.04,{vol:.04}),
  die:()=>{tone(300,.5,{type:'sawtooth',slide:-250,vol:.06})},
  place:()=>tone(520,.06,{type:'triangle',vol:.1}),
  merge:t=>[0,5,9].forEach((s,i)=>tone(440*Math.pow(2,(s+t*2)/12),.08,{delay:i*.06,vol:.045})),
  err:()=>tone(160,.12,{vol:.05}),
  coin:()=>{tone(988,.06,{vol:.05});tone(1319,.12,{delay:.06,vol:.05})},
  boom:()=>tone(120,.25,{type:'sawtooth',slide:-80,vol:.07}),
  store:()=>tone(660,.05,{vol:.04,slide:200})
};
const buzz=p=>{if(!S.vib)return;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ---------- 屏幕尺寸（固定 3:4，逻辑 240×320） ---------- */
const lcd=$('#lcd'),wrapEl=$('#wrap'),glCanvas=$('#gl'),c2=$('#c2'),ctx=c2.getContext('2d');
function resetCtx(){ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;ctx.globalAlpha=1;ctx.textBaseline='alphabetic';ctx.textAlign='left';}
resetCtx();
function layout(){
  const r=wrapEl.getBoundingClientRect();if(!r.width||!r.height)return;
  // 让每个 LCD 像素对齐整数个物理像素：像素栅格/扫描线不出摩尔纹，画面放大也更锐利
  const dpr=window.devicePixelRatio||1,avail=Math.min(r.width,r.height*.75),x=avail*dpr/240,ki=Math.floor(x);
  const snapInt=ki>=2&&ki>=x*.92,w=snapInt?ki*240/dpr:Math.floor(avail);
  lcd.style.width=w+'px';lcd.style.height=(w*4/3)+'px';
  lcd.style.setProperty('--u',(w/240)+'px');lcd.classList.toggle('lcdfrac',!snapInt);
  drawPixelMatrix(w,w*4/3,dpr);
}
// 逐像素 LCD 矩阵：按物理像素计算每个格子的边界，任何缩放下都均匀、无摩尔纹
let pixKey='';
function drawPixelMatrix(w,h,dpr){
  const pc=$('#pixc');if(!pc)return;const W2=Math.round(w*dpr),H2=Math.round(h*dpr),key=W2+'x'+H2;if(key===pixKey)return;pixKey=key;
  pc.width=W2;pc.height=H2;const g=pc.getContext('2d');g.clearRect(0,0,W2,H2);
  const cw=W2/240,chh=H2/320,strong=cw>=2.6,lt=S.look==='pearl',a=strong?(lt?.22:.32):(lt?.12:.16),gap=cw>=6?2:1;
  g.fillStyle='rgba(0,0,0,'+a+')';
  for(let i=0;i<=240;i++){const x=Math.round(i*cw);g.fillRect(x,0,gap,H2);}
  for(let j=0;j<=320;j++){const y=Math.round(j*chh);g.fillRect(0,y,W2,gap);}
  if(cw>=3){const cols=['rgba(255,40,40,.08)','rgba(40,255,40,.08)','rgba(40,80,255,.09)'];
    for(let i=0;i<240;i++){const x0=Math.round(i*cw)+gap,x1=Math.round((i+1)*cw),sw=(x1-x0)/3;
      for(let k=0;k<3;k++){g.fillStyle=cols[k];g.fillRect(Math.round(x0+k*sw),0,Math.max(1,Math.round(sw)),H2);}}}
}
layout();
window.addEventListener('resize',layout);
window.addEventListener('orientationchange',()=>setTimeout(layout,250));
if(window.ResizeObserver)new ResizeObserver(layout).observe(wrapEl);
function clock(){const d=new Date();$('#clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
clock();setInterval(clock,15000);

/* ---------- PWA ---------- */
let deferredPrompt=null;
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
function pngIcon(){
  const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');
  g.fillStyle='#0b0b0e';g.fillRect(0,0,180,180);
  g.fillStyle='#2f8dff';g.fillRect(0,0,10,180);g.fillRect(170,0,10,180);
  g.fillStyle='#b3d36b';g.fillRect(30,24,120,132);
  g.fillStyle='#1c2d0b';[[50,120],[60,120],[70,120],[80,120],[80,110],[80,100],[90,100],[100,100]].forEach(([x,y])=>g.fillRect(x,y,9,9));
  g.fillRect(122,70,9,9);
  [['#ff7ac8',56,40],['#7ae1ff',64,60]].forEach(([c3,x,y])=>{g.fillStyle=c3;g.fillRect(x,y,50,18);g.fillStyle='#231a55';for(let i=0;i<3;i++)g.fillRect(x+6+i*15,y+5,8,8);});
  return c.toDataURL('image/png');
}
try{
  const icon=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='#0b0b0e'/><rect x='0' width='4' height='64' fill='#2f8dff'/><rect x='60' width='4' height='64' fill='#2f8dff'/><rect x='12' y='8' width='40' height='46' fill='#b3d36b'/><path d='M18 42h16v-8h8' stroke='#1c2d0b' stroke-width='4' fill='none'/><rect x='42' y='22' width='4' height='4' fill='#1c2d0b'/></svg>`;
  const iconURL='data:image/svg+xml,'+encodeURIComponent(icon);
  const man={name:'WAV PHONE',short_name:'WAV PHONE',start_url:location.href,display:'standalone',orientation:'portrait',
    background_color:'#0b0b0e',theme_color:'#0b0b0e',icons:[{src:iconURL,sizes:'any',type:'image/svg+xml',purpose:'any'}]};
  $('#mf').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(man));
  try{$('#ati').href=pngIcon();}catch(e){$('#ati').href=iconURL;}
  const fav=document.createElement('link');fav.rel='icon';fav.href=iconURL;document.head.appendChild(fav);
}catch(e){}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
async function install(){if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;render();}

/* ---------- 评分工具 ---------- */
function grade(v,th){return v>=th[0]?'S':v>=th[1]?'A':v>=th[2]?'B':v>=th[3]?'C':'D';}
function flash(t,cls){const f=$('#flash');f.className='flash';void f.offsetWidth;f.textContent=t;f.className='flash go '+(cls||'');}

/* ---------- 像素绘图工具（逻辑坐标 240×320，内部 2 倍） ---------- */
function hexRGB(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function shade(h,k){const [r,g,b]=hexRGB(h);const f=v=>Math.round(clamp(k>0?v+(255-v)*k:v*(1+k),0,255));return'rgb('+f(r)+','+f(g)+','+f(b)+')';}
const FR=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
function pball(x,y,r,col,outline){
  x=Math.round(x);y=Math.round(y);
  const row=(rr,c,ox,oy)=>{ctx.fillStyle=c;for(let yy=-rr;yy<=rr;yy++){const w=Math.floor(Math.sqrt(rr*rr-yy*yy)+.35);ctx.fillRect(x+ox-w,y+oy+yy,w*2+1,1);}};
  if(outline)row(r+1,outline,0,0);
  row(r,shade(col,-.28),0,0);
  row(Math.max(1,r-1),col,-Math.max(1,r*.18|0),-Math.max(1,r*.18|0));
  if(r>=3)row(Math.max(1,r*.3|0),shade(col,.45),-Math.round(r*.4),-Math.round(r*.4));
}
function cube(x,y,w,h,dy,col,ol){
  x=Math.round(x);y=Math.round(y);
  const top=shade(col,.3),side=shade(col,-.3);
  if(ol){FR(x-1,y-dy-1,w+2*dy+2,h+dy+2,ol);}
  FR(x,y,w,h,col);
  for(let i=1;i<=dy;i++){FR(x+2*i-2+w,y-i+1,2,h,side);FR(x+2*i-1,y-i,w,1,top);}

async function saveFile(blob,filename){
  try{
    const file=new File([blob],filename,{type:blob.type});
    if(!window.claude&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:filename});return'Choose Save Image / Save Video';

  if(dlNS){try{await dlNS.save({filename,data:blob});return'Saved';}catch(e){if(e&&e.code==='declined')return'Cancelled';}}

}
function settingsMenu(){
  const skins=['blue','red','lime'],skinN={blue:'Ice Blue',red:'Ruby Red',lime:'Neon Lime'};
  return{type:'list',title:'Settings',sel:0,items:()=>{
    const a=[
      {label:'Sound',value:()=>S.snd?'On':'Off',adj:()=>{S.snd=!S.snd;saveS();}},
      {label:'Vibration',value:()=>S.vib?'On':'Off',adj:()=>{S.vib=!S.vib;saveS();}},
      {label:'Display',value:()=>S.green?'Retro green':'Colour',adj:()=>{S.green=!S.green;applySkin();saveS();}},
      {label:'Theme',value:()=>S.look==='pearl'?'Pearl':'Black',adj:()=>{S.look=S.look==='pearl'?'black':'pearl';applySkin();saveS();}},
      {label:'Accent',value:()=>skinN[S.skin],adj:d=>{S.skin=skins[(skins.indexOf(S.skin)+(d||1)+3)%3];applySkin();saveS();}}];
    if(deferredPrompt)a.push({label:'Install app',act:install});
    else if(isIOS&&!isStandalone)a.push({label:'Add to Home Screen',act:()=>push({type:'text',title:'Home Screen',
      html:'<p>1. Open this page in Safari.</p><p>2. Tap the <b>Share</b> button.</p><p>3. Choose <b>Add to Home Screen</b>.</p><p>Launch it from the icon for a full-screen phone.</p>'})});
    a.push({label:'Key guide',act:()=>push({type:'text',title:'Key guide',html:
      '<p><b>Standby</b> - OK opens the menu. Left soft key opens the Camera, right soft key opens Paint.</p><p><b>OK / Call / Left soft</b> - select or confirm.</p><p><b>Right soft</b> - back. Pauses games.</p><p><b>Red end key</b> - exit the current app. In menus it returns to standby.</p><p><b>Music keys</b> - left, pause, right.</p><p>Every game also works by touch: tap, swipe or drag.</p>'})});
    a.push({label:'About',act:()=>push({type:'text',title:'About',html:'<p><b>WAV PHONE</b></p><p>A 240x320 pocket phone with a 2MP camera, Paint and seven games.</p><p>No high scores are stored. Each game ends with a rating card.</p>'})});
    return a;}};
}
function openMenuItem(i){const id=MENU[i][0];
  if(id==='set')push(settingsMenu());
  else if(APPS[id].kind==='tool')startApp(id);
  else push(gameMenu(id));
}
function startApp(id,opts){
  if(App.game&&App.gameId!==id&&App.game.stop)App.game.stop();
  App.game=APPS[id];App.gameId=id;App.dialog=null;App.opts=opts||null;
  App.game.start(opts);render();
}
function quitGame(){if(App.game&&App.game.stop)App.game.stop();App.game=null;App.gameId=null;App.dialog=null;if(!App.stack.length)App.view='menu';render();}
function pauseGame(){if(!App.game||App.dialog)return;
  const custom=App.game.pauseItems&&App.game.pauseItems();
  App.dialog={kind:'pause',title:'Paused',sel:0,items:custom||[{label:'Resume',act:resumeGame},{label:'Restart',act:()=>startApp(App.gameId,App.opts)},{label:'Quit game',act:quitGame}]};render();}
function resumeGame(){App.dialog=null;render();}
App.quitGame=quitGame;App.refresh=()=>render();
App.openDialog=d=>{App.dialog=Object.assign({kind:'custom',sel:0},d);render();};
App.closeDialog=()=>{App.dialog=null;render();};
App.gameOver=res=>{
  if(!App.game)return;
  App.dialog={kind:'over',title:res.dlgTitle||'Game Over',res,sel:0,items:res.items||[{label:'Play again',act:()=>startApp(App.gameId,App.opts)},{label:'Back to menu',act:quitGame}]};
  if(!res.items)SFX.over();render();
};
function listItems(o){return typeof o.items==='function'?o.items():o.items;}
function rowsHTML(o){
  const items=listItems(o);if(o.sel>=items.length)o.sel=0;
  return items.map((it,i)=>{const v=it.value?`<span class="v${it.adj?'':' nv'}">${it.value()}</span>`:'';
    return`<div class="row${i===o.sel?' on':''}" data-row="${i}"><span>${it.label}</span>${v}</div>`;}).join('');
}
function sbar(){const el=$('#ui .lst')||$('#ui .txt'),b=$('#ui .sbar i');if(!el||!b)return;const h=el.clientHeight,sh=el.scrollHeight;
  if(sh<=h+2){b.parentNode.style.display='none';return;}const k=h/sh;b.style.height=(k*100)+'%';b.style.top=(el.scrollTop/sh*100)+'%';}
function setSoft(l,c,r){$('#skL').textContent=l;$('#skC').textContent=c;$('#skR').textContent=r;}
function dateStr(){const d=new Date();return WD[d.getDay()]+', '+d.getDate()+' '+MO[d.getMonth()];}
function hmH(){const d=new Date();return String(d.getHours()).padStart(2,'0')+'<span class="colon">:</span>'+String(d.getMinutes()).padStart(2,'0');}
function hm(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
let lastKey='',lastDepth=0,lastDlg=null;
function animate(ui,key,depth){if(key!==lastKey){const el=ui.firstElementChild;if(el&&el.classList.contains('scr')||el&&el.classList.contains('stby'))el.classList.add(depth<lastDepth?'anim-back':'anim-in');lastKey=key;lastDepth=depth;}}
function render(){
  const ui=$('#ui'),G=App.game;
  glCanvas.style.display=G&&G.surface==='gl'?'block':'none';
  c2.style.display=G&&G.surface==='2d'?'block':'none';
  const tw=App.gameId==='tower'&&G&&G.showHud();
  $('#hud').classList.toggle('on',!!tw);$('#bal').classList.toggle('on',!!tw);
  if(!tw)$('#combo').classList.remove('on');
  if(App.gameId!=='tower')$('#ov').innerHTML='';
  if(G&&G.onRender)G.onRender();else $('#pv').style.display='none';
  if(G){
    if(!App.dialog){ui.innerHTML='';lastDlg=null;lastKey='game';const s=G.softs();setSoft(s[0],s[1],s[2]);return;}
    const d=App.dialog;let body='';
    if(d.res){const r=d.res;
      body=`<div class="res"><div class="grade">${r.grade}</div><div class="ttl">${r.title}</div>
        <div class="stats">${r.stats.map(([a,b])=>`<span><i>${a}</i><b>${b}</b></span>`).join('')}</div>
        <div class="cmt">${r.comment||''}</div></div>`;}
    ui.innerHTML=`<div class="dim"></div><div class="dlg"><h3>${d.title}</h3>${body}<div class="rows" style="max-height:calc(var(--u)*170);overflow:auto">${rowsHTML(d)}</div></div>`;
    const on=ui.querySelector('.row.on');on&&on.scrollIntoView({block:'nearest'});
    if(d!==lastDlg){const dl=ui.querySelector('.dlg');dl&&dl.classList.add('pop');lastDlg=d;}
    setSoft('Select','','Back');return;
  }
  lastDlg=null;
  const top=App.stack[App.stack.length-1];
  if(!top&&App.view==='standby'){
    ui.innerHTML=`<div class="stby"><div class="shine"></div><div class="op">WAV</div><div class="bigclock" id="bigclock">${hmH()}</div><div class="date">${dateStr()}</div><div class="logo">WAV PHONE</div></div>`;
    animate(ui,'stby',0);setSoft('Camera','Menu','Paint');return;
  }
  if(!top){
    ui.innerHTML=`<div class="scr"><div class="hdr">${MENU[App.menuSel][1]}</div><div class="mgrid">${MENU.map(([id,n],i)=>
      `<div class="mi${i===App.menuSel?' on':''}" data-mi="${i}">${ICONS[id]}<span>${n}</span></div>`).join('')}</div></div>`;
    const on=ui.querySelector('.mi.on');on&&on.scrollIntoView({block:'nearest'});animate(ui,'menu',1);
    setSoft('Select','','Back');return;
  }
  if(top.type==='list'){
    ui.innerHTML=`<div class="scr"><div class="hdr">${top.title}</div><div class="lst">${rowsHTML(top)}</div><div class="sbar"><i></i></div></div>`;
    const on=ui.querySelector('.row.on');on&&on.scrollIntoView({block:'nearest'});sbar();const ls=ui.querySelector('.lst');ls&&ls.addEventListener('scroll',sbar,{passive:true});animate(ui,'l'+App.stack.length+top.title,App.stack.length+1);
    setSoft('Select','','Back');return;
  }
  ui.innerHTML=`<div class="scr"><div class="hdr">${top.title}</div><div class="txt">${top.html}</div><div class="sbar"><i></i></div></div>`;
  sbar();const tx=ui.querySelector('.txt');tx&&tx.addEventListener('scroll',sbar,{passive:true});animate(ui,'t'+App.stack.length+top.title,App.stack.length+1);
  setSoft('','','Back');
}
function navList(o,k,back){
  const items=listItems(o),it=items[o.sel];
  if(k==='up')o.sel=(o.sel+items.length-1)%items.length;
  else if(k==='down')o.sel=(o.sel+1)%items.length;
  else if((k==='left'||k==='right')&&it&&it.adj)it.adj(k==='left'?-1:1);
  else if(isSel(k)&&it){if(it.act){it.act();return;}if(it.adj)it.adj(1);}
  else if(k==='R'){back();return;}
  render();
}
function press(k){
  ensureAC();
  if(k==='end'){SFX.key();if(App.game)quitGame();else{App.stack=[];App.view='standby';render();}return;}
  if(App.game&&!App.dialog){
    if(App.game.kind==='game'&&(k==='R'||k==='play')){SFX.key();pauseGame();return;}
    App.game.key(k);return;}
  SFX.key();
  if(App.dialog){
    const d=App.dialog;
    if(k==='play'&&d.kind==='pause'){resumeGame();return;}
    navList(d,k,()=>{if(d.kind==='pause'||d.kind==='custom')App.closeDialog();else quitGame();});return;
  }
  const top=App.stack[App.stack.length-1];
  if(!top&&App.view==='standby'){
    if(k==='L')startApp('camera');else if(k==='R')startApp('paint');else if(k==='ok'||k==='call'||k==='up'||k==='down'){App.view='menu';render();}
    return;}
  if(!top){
    const n2=MENU.length;
    if(k==='left')App.menuSel=(App.menuSel+n2-1)%n2;else if(k==='right')App.menuSel=(App.menuSel+1)%n2;
    else if(k==='up')App.menuSel=(App.menuSel+n2-3)%n2;else if(k==='down')App.menuSel=(App.menuSel+3)%n2;
    else if(isSel(k)){openMenuItem(App.menuSel);return;}
    else if(k==='R'){App.view='standby';}
    render();return;}
  if(top.type==='list'){navList(top,k,()=>{App.stack.pop();render();});return;}
  const el=$('#ui .txt');
  if(k==='up'){el&&(el.scrollTop-=40);sbar();}else if(k==='down'){el&&(el.scrollTop+=40);sbar();}
  else if(k==='R'||isSel(k)){App.stack.pop();render();}
}

/* ---- 实体按键（按住方向键自动连发） ---- */
let rep=null;
document.querySelectorAll('[data-k]').forEach(b=>{
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('down');const k=b.dataset.k;press(k);
    clearTimeout(rep&&rep.t);clearInterval(rep&&rep.i);
    if(['up','down','left','right'].includes(k)&&App.game)rep={t:setTimeout(()=>{rep.i=setInterval(()=>press(k),90);},320)};});
  const up=()=>{b.classList.remove('down');if(rep){clearTimeout(rep.t);clearInterval(rep.i);rep=null;}};
  ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,up));
  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();press(b.dataset.k);}});
});
/* ---- 屏幕触控 ---- */
function lpos(e){const r=lcd.getBoundingClientRect();return[(e.clientX-r.left)/r.width*240,(e.clientY-r.top)/r.height*320];}
let uiDown=null;
lcd.addEventListener('pointerdown',e=>{
  ensureAC();
  const soft=e.target.closest('[data-soft]');
  if(soft&&soft.textContent.trim()){e.preventDefault();press(soft.dataset.soft);return;}
  const row=e.target.closest('[data-row]'),mi=e.target.closest('[data-mi]'),st=e.target.closest('.stby');
  if(row||mi||st){uiDown={row,mi,st,y:e.clientY};return;}
  if(App.game&&!App.dialog){e.preventDefault();try{lcd.setPointerCapture(e.pointerId)}catch(_){}const [x,y]=lpos(e);App.game.pointer&&App.game.pointer('down',x,y);}
});
lcd.addEventListener('pointermove',e=>{if(App.game&&!App.dialog&&!uiDown&&e.buttons){const [x,y]=lpos(e);App.game.pointer&&App.game.pointer('move',x,y);}});
lcd.addEventListener('pointerup',e=>{
  if(uiDown){const u=uiDown;uiDown=null;if(Math.abs(e.clientY-u.y)>10)return;SFX.key();
    if(u.st){App.view='menu';render();return;}
    if(u.mi){const i=+u.mi.dataset.mi;if(i===App.menuSel)openMenuItem(i);else{App.menuSel=i;render();}return;}
    const o=App.dialog||App.stack[App.stack.length-1];if(!o||!o.items)return;
    o.sel=+u.row.dataset.row;const it=listItems(o)[o.sel];if(!it)return;
    if(it.act)it.act();else if(it.adj){it.adj(1);render();}return;}
  if(App.game&&!App.dialog){const [x,y]=lpos(e);App.game.pointer&&App.game.pointer('up',x,y);}
});
/* ---- 键盘 ---- */
const KMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'ok',' ':'ok',Escape:'R',Backspace:'end',p:'play',
  '2':'up','8':'down','4':'left','6':'right','5':'ok'};
window.addEventListener('keydown',e=>{
  const k=KMAP[e.key];if(!k)return;
  if(e.repeat&&!['up','down','left','right'].includes(k))return;
  const ae=document.activeElement;if(ae&&ae.dataset&&ae.dataset.k&&(e.key==='Enter'||e.key===' '))return;
  e.preventDefault();press(k);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&App.game&&App.game.kind==='game')pauseGame();});
/* ---- iOS：解锁音频、禁止缩放/回弹/长按菜单 ---- */
const unlock=()=>{ensureAC();if(ac){try{const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0);}catch(e){}}
  if(ac&&ac.state==='running'){document.removeEventListener('touchend',unlock,true);document.removeEventListener('click',unlock,true);}};
document.addEventListener('touchend',unlock,true);document.addEventListener('click',unlock,true);
['gesturestart','gesturechange','dblclick'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(!e.target.closest('.lst,.txt,.mgrid,.rows'))e.preventDefault();},{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
setInterval(()=>{const b=$('#bigclock');if(b)b.innerHTML=hmH();},10000);

/* ---- 主循环 ---- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  const G=App.game;
  if(G){if(!App.dialog)G.update(dt);if(G.surface==='2d')resetCtx();G.draw(dt);}
  requestAnimationFrame(loop);
}
applySkin();render();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
